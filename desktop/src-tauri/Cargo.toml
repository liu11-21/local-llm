[package]
name = "localllm-desktop"
version = "0.7.0"
description = "Local LLM desktop workspace"
edition = "2021"

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.5", features = ["protocol-asset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
