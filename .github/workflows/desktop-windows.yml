name: Desktop workspace (Windows x64)
on:
  workflow_dispatch:
  push:
    branches: ['dev/desktop-workspace']
    paths: ['desktop/**', '*.py', 'logo.ico', 'third_party/**', 'LICENSE', '*POLICY.md', 'PRIVACY.md', 'SECURITY.md', 'THIRD_PARTY_LICENSES.md', 'RELEASE_PROCESS.md', 'docs/legal/**', 'docs/sbom/**', '.gitattributes', '.github/workflows/desktop-windows.yml']
  pull_request:
    paths: ['desktop/**', '*.py', 'logo.ico', 'third_party/**', '.gitattributes', '.github/workflows/desktop-windows.yml']

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      PYTHONIOENCODING: utf-8
      RUST_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Pin toolchain and Python packager
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$env:RUST_TOOLCHAIN" >> $env:GITHUB_ENV
          python -m pip install --only-binary=:all: -r desktop/requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r desktop/requirements-audit.lock
      - name: Test Python and build the onedir worker
        shell: pwsh
        run: |
          python check_workspace_version.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python build_desktop_worker.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest -v test_desktop_worker.PackagedWorkerTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python check_workspace_version.py --build build/workspace-build.json --worker build/desktop-worker/LocalLLMWorker/LocalLLMWorker.exe
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: '4354605004c7d8db1f88bca8e3cc1ef38b135b55'
          path: build/upgrade-source
          persist-credentials: false
      - name: Build actual Workspace 0.6.2 upgrade baseline
        shell: pwsh
        run: |
          python build/upgrade-source/build_desktop_worker.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location build/upgrade-source/desktop
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'desktop/src-tauri/target'
          npm run tauri -- build --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Remove-Item Env:CARGO_TARGET_DIR
          $baseline = Get-Item 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Local LLM Workspace_0.6.2_x64-setup.exe'
          New-Item -ItemType Directory -Force build/upgrade-baseline | Out-Null
          Move-Item -LiteralPath $baseline.FullName -Destination build/upgrade-baseline/
      - name: Exercise desktop layout in Chromium
        working-directory: desktop
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:layout
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows per-user installer (unsigned)
        working-directory: desktop
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml | Set-Content ../build/cargo-license-metadata.json -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ../license_audit.py collect --output ../build/release-notices --network --crate-archives --cargo-metadata ../build/cargo-license-metadata.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ../release_evidence.py prepare-notices --directory ../build/release-notices
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run tauri -- build --target x86_64-pc-windows-msvc -- --locked
      - name: Verify installer inventory and produce checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one Windows installer." }
          $out = New-Item -ItemType Directory -Force build/windows-review
          $files | Copy-Item -Destination $out
          foreach ($file in (Get-ChildItem $out -Filter '*.exe' -File)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'NotSigned') { throw "Unsigned validation pipeline produced unexpected signing state: $($signature.Status)" }
            $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            $stamp = Get-Content build/workspace-build.json -Raw | ConvertFrom-Json
            if ($stamp.version -ne $version -or $stamp.channel -ne 'Development' -or $stamp.commit -ne $env:GITHUB_SHA) {
              throw 'Packaged Worker build identity disagrees with App build.'
            }
            $installerVersion = $file.VersionInfo.FileVersion
            if ($installerVersion -notmatch ('^' + [regex]::Escape($version) + '(\.0)?$')) {
              throw "Installer version mismatch: $installerVersion expected $version"
            }
            @{
              commit = $env:GITHUB_SHA; version = $version; run = $env:GITHUB_RUN_ID
              channel = 'Development'; worker_version = $stamp.version; installer_version = $installerVersion
              runner = $env:RUNNER_OS; target = 'x86_64-pc-windows-msvc'
              rust = (rustc --version); python = (python --version); node = (node --version)
              authenticode = $signature.Status.ToString(); sha256 = $hash; bytes = $file.Length
            } | ConvertTo-Json | Set-Content (Join-Path $out 'BUILD.json')
          }
      - name: Exercise the installed desktop app and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/windows-review -Filter '*.exe' -File
          ./desktop/smoke-install.ps1 -Installer $installer.FullName -BaselineInstaller 'build/upgrade-baseline/Local LLM Workspace_0.6.2_x64-setup.exe'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath build/release-notices -Destination build/windows-review/notices -Recurse
          python release_evidence.py verify --directory build/windows-review
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Attest candidate build provenance (not Windows code signing)
        id: provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/windows-review/*.exe
      - name: Preserve provenance bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination build/windows-review/provenance.sigstore.json
          @{source_commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attestation_url=$env:ATTESTATION_URL;authenticode='NotSigned';license='NOASSERTION';signpath='NOT APPLIED'} | ConvertTo-Json | Set-Content build/windows-review/PROVENANCE.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LocalLLM-workspace-Windows-x64-unsigned
          path: build/windows-review/
          if-no-files-found: error
          retention-days: 14
